<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tonguebox – Sätze testen</title><style>body{font:20px system-ui;background:#071323;color:#fff;max-width:780px;margin:auto;padding:22px}h1{font-size:1.8rem}button,a,input{font:inherit}button{background:#32d0be;color:#071323;border:0;border-radius:16px;padding:20px;min-height:68px;cursor:pointer}input{box-sizing:border-box;width:100%;padding:18px;border-radius:12px;margin:10px 0 20px}a{color:#64e6d8}li{padding:16px;margin:12px 0;background:#143049;border-radius:12px;overflow-wrap:anywhere}li button{margin:8px 8px 0 0}#status{padding:12px;min-height:28px}button:focus-visible,input:focus-visible{outline:4px solid #fff} .danger{background:#ffc3b7}</style></head><body><h1>👁️ Tonguebox – Meine Sätze</h1><p><a href="konto.html">Zum Benutzerkonto</a></p><p>Hier kannst du die Speicherung in deiner Datenbank testen.</p><label for="satz">Neuen Satz eingeben</label><input id="satz" maxlength="2000" placeholder="Zum Beispiel: Ich hätte gerne einen Kaffee."><button id="save">Satz speichern</button> <button id="reload">Sätze neu laden</button><p id="status" role="status" aria-live="polite"></p><h2>Gespeicherte Sätze</h2><ul id="list"></ul><script>
const api='https://api.e-tongue.com/sentences.php';const status=document.getElementById('status');const list=document.getElementById('list');const input=document.getElementById('satz');
async function request(data){const opts={credentials:'include'};if(data){opts.method='POST';opts.headers={'Content-Type':'application/json'};opts.body=JSON.stringify(data)}const response=await fetch(api,opts);const result=await response.json();if(!response.ok||!result.success)throw Error(result.error||'Serverfehler');return result}
async function load(){status.textContent='Lade Sätze …';try{const result=await request();list.replaceChildren();for(const item of result.sentences){const li=document.createElement('li');const txt=document.createElement('div');txt.textContent=item.text;li.append(txt);const speak=document.createElement('button');speak.textContent='🔊 Vorlesen';speak.onclick=()=>{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(item.text))};const edit=document.createElement('button');edit.textContent='✏️ Bearbeiten';edit.onclick=async()=>{const next=prompt('Satz bearbeiten:',item.text);if(next===null)return;try{await request({action:'update',id:item.id,text:next});await load()}catch(e){status.textContent=e.message}};const del=document.createElement('button');del.className='danger';del.textContent='🗑️ Löschen';del.onclick=async()=>{if(!confirm('Diesen Satz wirklich löschen?'))return;try{await request({action:'delete',id:item.id});await load()}catch(e){status.textContent=e.message}};li.append(speak,edit,del);list.append(li)}status.textContent=result.sentences.length+' Sätze geladen.'}catch(e){status.textContent='Fehler: '+e.message+' – Bitte zuerst über konto.html anmelden.'}}
document.getElementById('save').onclick=async()=>{if(!input.value.trim())return;try{await request({action:'add',text:input.value});input.value='';await load()}catch(e){status.textContent='Fehler: '+e.message}};document.getElementById('reload').onclick=load;load();
</script></body></html>
