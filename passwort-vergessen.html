<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passwort vergessen – Tonguebox</title><style>:root{color-scheme:dark}body{font:1.15rem/1.5 system-ui,sans-serif;background:#0b1830;color:#fff;margin:0;padding:24px}main{max-width:650px;margin:4vh auto;background:#162844;border-radius:22px;padding:clamp(20px,5vw,40px)}h1{font-size:clamp(1.6rem,5vw,2.2rem)}label{display:block;font-weight:700;margin:22px 0 8px}input,button,a.button{box-sizing:border-box;width:100%;min-height:64px;font:inherit;border-radius:14px;padding:14px 18px}input{background:white;color:#14213a;border:3px solid #91c9d3}button{margin-top:22px;background:#32b6ac;color:#071c2b;font-weight:800;border:0;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #ffe08a;outline-offset:4px}button:disabled{opacity:.7}a{color:#9ce8ec}#status{min-height:2.5em;margin-top:20px}p{max-width:60ch}</style></head><body><main><h1>🔐 Passwort vergessen?</h1><p>Gib deine E-Mail-Adresse ein. Wenn dafür ein Tonguebox-Konto existiert, erhältst du einen Link zum Zurücksetzen deines Passworts.</p><form id="form"><label for="email">E-Mail-Adresse</label><input id="email" type="email" autocomplete="email" required><button id="send" type="submit">Link per E-Mail anfordern</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="konto.html">← Zurück zum Benutzerkonto</a></p></main><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('send'),s=document.getElementById('status');b.disabled=true;s.textContent='Anfrage wird gesendet …';try{const r=await fetch('https://api.e-tongue.com/request-password-reset.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim()})});const d=await r.json();if(!r.ok)throw Error(d.error||'Anfrage fehlgeschlagen');s.textContent='Wenn ein Konto mit dieser E-Mail-Adresse existiert, erhältst du in Kürze einen Link. Bitte prüfe auch den Spam-Ordner.'}catch(err){s.textContent='Die Anfrage konnte nicht gesendet werden. Bitte versuche es später erneut.'}finally{b.disabled=false}});</script></body></html>
