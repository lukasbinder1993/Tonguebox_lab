<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Tongue – KI Phrasenvorschläge</title>

<style>
:root {
    --bg: #07111f;
    --panel: #103958;
    --panel2: #0d2e49;
    --accent: #35d6bd;
    --accent2: #22abc8;
    --text: #ffffff;
    --muted: #d7e4ed;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
}

header {
    text-align: center;
    padding: 24px;
    border-bottom: 2px solid var(--accent2);
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: var(--muted);
}

main {
    width: min(1400px, 96%);
    margin: auto;
    padding-bottom: 60px;
}

h2 {
    margin-top: 32px;
    color: var(--accent);
}

/* ZEIT */

.zeitbox {
    margin-top: 25px;
    padding: 20px;
    text-align: center;
    background: var(--panel2);
    border: 2px solid var(--accent2);
    border-radius: 16px;
    font-size: 21px;
}

.zeitbox strong {
    color: var(--accent);
}

/* THEMEN */

.themen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 15px;
}

button {
    cursor: pointer;
    font-family: inherit;
    border: 3px solid transparent;
}

button:hover,
button:focus {
    border-color: white;
    outline: none;
    transform: scale(1.02);
}

.thema {
    min-height: 105px;
    border-radius: 15px;
    background: var(--panel);
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.thema.active {
    background: var(--accent);
    color: #06212a;
}

/* PHRASEN */

.phrasen {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
}

.phrase {
    min-height: 120px;
    padding: 20px;
    background: var(--panel);
    border-radius: 15px;
    color: white;
    text-align: left;
    font-size: 23px;
    line-height: 1.35;
}

.phrase::before {
    content: "🔊 ";
}

/* KI */

.ki-box {
    background: var(--panel2);
    border: 2px solid var(--accent2);
    padding: 20px;
    border-radius: 16px;
}

textarea {
    width: 100%;
    min-height: 110px;
    padding: 16px;
    border-radius: 12px;
    border: 3px solid var(--accent2);
    font-size: 21px;
    resize: vertical;
}

.action {
    margin-top: 15px;
    min-height: 80px;
    padding: 15px 25px;
    background: var(--accent);
    color: #06212a;
    font-size: 21px;
    font-weight: bold;
    border-radius: 14px;
}

.action:disabled {
    opacity: .6;
}

#kiStatus {
    min-height: 28px;
}

/* STIMME */

select {
    width: 100%;
    min-height: 65px;
    padding: 10px;
    font-size: 19px;
    border-radius: 10px;
}

/* MOBIL */

@media(max-width:800px) {

    .phrasen {
        grid-template-columns: 1fr;
    }

    header h1 {
        font-size: 29px;
    }

    .phrase {
        min-height: 105px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 E-Tongue</h1>
    <p>KI-gestützte Unterstützte Kommunikation</p>
</header>

<main>

<!-- ZEIT -->

<div class="zeitbox">

    <div id="datum"></div>

    <div id="uhrzeit"></div>

    <p>
        Tageszeit:
        <strong id="tageszeit"></strong>
    </p>

</div>


<!-- AUTOMATISCHE VORSCHLÄGE -->

<h2>✨ Vorschläge für jetzt</h2>

<div id="autoPhrasen" class="phrasen"></div>


<!-- THEMEN -->

<h2>💬 Thema auswählen</h2>

<div class="themen">

<button class="thema"
onclick="waehleThema('Allgemein',this)">
💬 Allgemein
</button>

<button class="thema"
onclick="waehleThema('Kaffee',this)">
☕ Kaffee
</button>

<button class="thema"
onclick="waehleThema('Trinken',this)">
🥤 Trinken
</button>

<button class="thema"
onclick="waehleThema('Essen',this)">
🍽️ Essen
</button>

<button class="thema"
onclick="waehleThema('Schmerzen',this)">
🩺 Schmerzen
</button>

<button class="thema"
onclick="waehleThema('Befinden',this)">
❤️ Befinden
</button>

<button class="thema"
onclick="waehleThema('Unterhaltung',this)">
🗣️ Unterhaltung
</button>

<button class="thema"
onclick="waehleThema('Hilfe',this)">
🆘 Hilfe
</button>

<button class="thema"
onclick="waehleThema('Pflege',this)">
🛏️ Pflege
</button>

<button class="thema"
onclick="waehleThema('Fragen',this)">
❓ Fragen
</button>

</div>


<!-- LOKALE VORSCHLÄGE -->

<h2 id="themaTitel">💡 Allgemeine Vorschläge</h2>

<div id="themenPhrasen" class="phrasen"></div>


<!-- KI -->

<h2>🤖 KI-Phrasenvorschläge</h2>

<div class="ki-box">

<p>
Die KI berücksichtigt automatisch
<strong>Tageszeit, Wochentag und ausgewähltes Thema</strong>.
</p>

<textarea
id="kiKontext"
placeholder="Optional: Was möchtest du ungefähr sagen?">
</textarea>

<button
id="kiButton"
class="action"
onclick="holeKIPhrasen()">
🤖 KI-Vorschläge erstellen
</button>

<p id="kiStatus"></p>

</div>

<br>

<div id="kiPhrasen" class="phrasen"></div>


<!-- EIGENER TEXT -->

<h2>✍️ Eigener Text</h2>

<textarea
id="eigenerText"
placeholder="Schreibe hier deinen Satz ...">
</textarea>

<button class="action"
onclick="sprecheEigenenText()">
🔊 Vorlesen
</button>

<button class="action"
onclick="speichereSatz()">
⭐ Speichern
</button>


<!-- GESPEICHERTE SÄTZE -->

<h2>⭐ Meine Sätze</h2>

<div id="meineSaetze" class="phrasen"></div>


<!-- STIMME -->

<h2>🗣️ Stimme auswählen</h2>

<select id="stimmen"></select>

</main>


<script>

/* ======================================================
   E-TONGUE KONFIGURATION
====================================================== */

/*
WICHTIG:

Hier später deine Backend-Adresse eintragen.

NICHT den OpenAI API-Key eintragen!

Beispiel:

https://api.e-tongue.com/api/phrasen
*/

const KI_API_URL =
    "DEINE_BACKEND_URL/api/phrasen";


let aktuellesThema = "Allgemein";
let stimmen = [];


/* ======================================================
   TAGESZEIT
====================================================== */

function getTageszeit() {

    const h = new Date().getHours();

    if(h >= 5 && h < 9)
        return "Morgen";

    if(h >= 9 && h < 12)
        return "Vormittag";

    if(h >= 12 && h < 14)
        return "Mittag";

    if(h >= 14 && h < 18)
        return "Nachmittag";

    if(h >= 18 && h < 22)
        return "Abend";

    return "Nacht";
}


function aktualisiereZeit() {

    const jetzt = new Date();

    document.getElementById("datum").textContent =
        jetzt.toLocaleDateString(
            "de-AT",
            {
                weekday:"long",
                day:"2-digit",
                month:"long",
                year:"numeric"
            }
        );

    document.getElementById("uhrzeit").textContent =
        jetzt.toLocaleTimeString(
            "de-AT",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );

    document.getElementById("tageszeit").textContent =
        getTageszeit();
}


/* ======================================================
   TAGESZEITABHÄNGIGE PHRASEN
====================================================== */

const zeitPhrasen = {

Morgen:[
"Guten Morgen!",
"Wie hast du geschlafen?",
"Ich möchte frühstücken.",
"Ich hätte gerne einen Kaffee.",
"Was machen wir heute?",
"Ich freue mich auf den Tag."
],

Vormittag:[
"Wie geht es dir?",
"Was machen wir als Nächstes?",
"Ich brauche eine kurze Pause.",
"Ich hätte gerne einen Kaffee.",
"Was gibt es heute zu essen?",
"Ich möchte etwas erzählen."
],

Mittag:[
"Ich habe Hunger.",
"Was gibt es zum Mittagessen?",
"Ich hätte gerne etwas zu trinken.",
"Wie war dein Vormittag?",
"Das schmeckt gut.",
"Was machen wir nach dem Essen?"
],

Nachmittag:[
"Wie war dein Tag bisher?",
"Ich hätte gerne einen Kaffee.",
"Was machen wir heute noch?",
"Ich brauche eine Pause.",
"Erzähl mir etwas.",
"Ich möchte etwas trinken."
],

Abend:[
"Guten Abend!",
"Wie war dein Tag?",
"Was gibt es zum Abendessen?",
"Ich möchte mich entspannen.",
"Was machen wir morgen?",
"Ich bin müde."
],

Nacht:[
"Ich bin müde.",
"Ich möchte schlafen.",
"Bitte mach das Licht aus.",
"Bitte bleib noch kurz hier.",
"Ich brauche noch etwas.",
"Gute Nacht!"
]

};


/* ======================================================
   THEMENPHRASEN
====================================================== */

const themenPhrasen = {

Allgemein:[
"Ja.",
"Nein.",
"Bitte.",
"Danke.",
"Moment bitte.",
"Ich möchte etwas sagen."
],

Kaffee:[
"Ich hätte gerne einen Kaffee.",
"Bitte mach mir einen Kaffee.",
"Möchtest du auch einen Kaffee?",
"Der Kaffee schmeckt gut.",
"Bitte noch einen Kaffee.",
"Ich möchte keinen Kaffee mehr."
],

Trinken:[
"Ich habe Durst.",
"Ich möchte Wasser.",
"Bitte gib mir etwas zu trinken.",
"Bitte noch einen Schluck.",
"Das reicht, danke.",
"Ich möchte später etwas trinken."
],

Essen:[
"Ich habe Hunger.",
"Was gibt es zu essen?",
"Ich möchte etwas essen.",
"Das schmeckt gut.",
"Bitte noch etwas.",
"Ich bin satt."
],

Schmerzen:[
"Ich habe Schmerzen.",
"Die Schmerzen sind stärker geworden.",
"Bitte ändere meine Position.",
"Ich brauche Hilfe.",
"Bitte warte einen Moment.",
"Ich möchte zeigen, wo es weh tut."
],

Befinden:[
"Mir geht es gut.",
"Mir geht es nicht so gut.",
"Ich bin müde.",
"Ich fühle mich wohl.",
"Ich brauche eine Pause.",
"Ich möchte etwas erzählen."
],

Unterhaltung:[
"Wie geht es dir?",
"Was gibt es Neues?",
"Erzähl mir mehr.",
"Das ist interessant.",
"Was meinst du dazu?",
"Ich möchte dir etwas erzählen."
],

Hilfe:[
"Ich brauche Hilfe.",
"Bitte komm zu mir.",
"Kannst du mir helfen?",
"Bitte warte kurz.",
"Bitte ändere meine Position.",
"Danke für deine Hilfe."
],

Pflege:[
"Bitte ändere meine Position.",
"Ich möchte anders sitzen.",
"Bitte richte mich etwas auf.",
"Ich brauche eine Pause.",
"Das passt so.",
"Danke."
],

Fragen:[
"Wie geht es dir?",
"Was machen wir jetzt?",
"Wann geht es weiter?",
"Kannst du mir das erklären?",
"Was meinst du damit?",
"Kannst du das wiederholen?"
]

};


/* ======================================================
   PHRASEN RENDERN
====================================================== */

function renderPhrasen(id,liste) {

    const box =
        document.getElementById(id);

    box.innerHTML = "";

    liste.forEach(text => {

        const button =
            document.createElement("button");

        button.className = "phrase";

        button.textContent = text;

        button.onclick = () =>
            sprechen(text);

        box.appendChild(button);

    });
}


/* ======================================================
   THEMA
====================================================== */

function waehleThema(thema,button) {

    aktuellesThema = thema;

    document
    .querySelectorAll(".thema")
    .forEach(b =>
        b.classList.remove("active")
    );

    if(button)
        button.classList.add("active");


    document.getElementById(
        "themaTitel"
    ).textContent =
        "💡 " + thema;


    renderPhrasen(
        "themenPhrasen",
        themenPhrasen[thema]
    );
}


/* ======================================================
   TEXT TO SPEECH
====================================================== */

function ladeStimmen() {

    stimmen =
        speechSynthesis.getVoices();

    const select =
        document.getElementById("stimmen");

    select.innerHTML = "";


    stimmen.forEach((voice,index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            voice.name +
            " – " +
            voice.lang;


        if(
            voice.lang.startsWith("de")
        ) {
            option.selected = true;
        }


        select.appendChild(option);

    });
}


function sprechen(text) {

    if(!text)
        return;

    speechSynthesis.cancel();

    const u =
        new SpeechSynthesisUtterance(text);


    const index =
        document.getElementById(
            "stimmen"
        ).value;


    if(stimmen[index])
        u.voice = stimmen[index];


    u.lang = "de-DE";
    u.rate = 1;

    speechSynthesis.speak(u);
}


function sprecheEigenenText() {

    sprechen(
        document.getElementById(
            "eigenerText"
        ).value.trim()
    );
}


/* ======================================================
   KI
====================================================== */

async function holeKIPhrasen() {

    const status =
        document.getElementById(
            "kiStatus"
        );

    const button =
        document.getElementById(
            "kiButton"
        );

    const jetzt =
        new Date();


    const daten = {

        thema:
            aktuellesThema,

        kontext:
            document.getElementById(
                "kiKontext"
            ).value.trim(),

        tageszeit:
            getTageszeit(),

        wochentag:
            jetzt.toLocaleDateString(
                "de-AT",
                {
                    weekday:"long"
                }
            ),

        datum:
            jetzt.toLocaleDateString(
                "de-AT"
            ),

        uhrzeit:
            jetzt.toLocaleTimeString(
                "de-AT",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            )

    };


    button.disabled = true;

    button.textContent =
        "⏳ KI denkt ...";

    status.textContent =
        "Passende Kommunikationssätze werden erstellt ...";


    try {

        if(
            KI_API_URL.includes(
                "DEINE_BACKEND_URL"
            )
        ) {

            throw new Error(
                "Backend noch nicht eingerichtet."
            );

        }


        const response =
            await fetch(
                KI_API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json"
                    },

                    body:
                        JSON.stringify(daten)
                }
            );


        if(!response.ok) {

            throw new Error(
                "Serverfehler " +
                response.status
            );
        }


        const ergebnis =
            await response.json();


        if(
            !Array.isArray(
                ergebnis.phrasen
            )
        ) {

            throw new Error(
                "Ungültige Antwort"
            );
        }


        renderPhrasen(
            "kiPhrasen",
            ergebnis.phrasen
        );


        status.textContent =
            "✓ KI-Vorschläge sind bereit.";

    }

    catch(error) {

        console.error(error);

        /*
        FALLBACK:

        Wenn KI oder Internet nicht verfügbar
        ist, bleiben lokale Vorschläge nutzbar.
        */

        const fallback =
            themenPhrasen[
                aktuellesThema
            ] ||
            zeitPhrasen[
                getTageszeit()
            ];


        renderPhrasen(
            "kiPhrasen",
            fallback
        );


        status.textContent =
            "⚠️ KI momentan nicht erreichbar – lokale Vorschläge werden angezeigt.";

    }

    finally {

        button.disabled = false;

        button.textContent =
            "🤖 Neue KI-Vorschläge";

    }
}


/* ======================================================
   SÄTZE SPEICHERN
====================================================== */

function speichereSatz() {

    const feld =
        document.getElementById(
            "eigenerText"
        );

    const text =
        feld.value.trim();

    if(!text)
        return;


    let liste =
        JSON.parse(
            localStorage.getItem(
                "etongue_saetze"
            ) || "[]"
        );


    if(!liste.includes(text))
        liste.push(text);


    localStorage.setItem(
        "etongue_saetze",
        JSON.stringify(liste)
    );


    feld.value = "";

    ladeSaetze();
}


function ladeSaetze() {

    const liste =
        JSON.parse(
            localStorage.getItem(
                "etongue_saetze"
            ) || "[]"
        );


    const box =
        document.getElementById(
            "meineSaetze"
        );

    box.innerHTML = "";


    if(liste.length === 0) {

        box.innerHTML =
            "<p>Noch keine eigenen Sätze gespeichert.</p>";

        return;
    }


    liste.forEach(text => {

        const button =
            document.createElement("button");

        button.className = "phrase";

        button.textContent = text;

        button.onclick =
            () => sprechen(text);

        box.appendChild(button);

    });
}


/* ======================================================
   START
====================================================== */

function start() {

    aktualisiereZeit();

    renderPhrasen(
        "autoPhrasen",
        zeitPhrasen[
            getTageszeit()
        ]
    );


    const ersterButton =
        document.querySelector(
            ".thema"
        );


    waehleThema(
        "Allgemein",
        ersterButton
    );


    ladeSaetze();

    ladeStimmen();


    setInterval(
        aktualisiereZeit,
        30000
    );
}


speechSynthesis.onvoiceschanged =
    ladeStimmen;


window.addEventListener(
    "load",
    start
);

</script>

</body>
</html>
