<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tonguebox Cloud</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f8f9;
      color: #10232a;
    }

    main {
      max-width: 760px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 22px;
      margin-bottom: 25px;
    }

    .status {
      background: white;
      border: 3px solid #087f8c;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 18px;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    .accordion {
      margin-bottom: 16px;
    }

    .accordion-button {
      width: 100%;
      min-height: 90px;
      border: none;
      border-radius: 18px;
      background: #087f8c;
      color: white;
      font-size: 25px;
      font-weight: bold;
      padding: 18px;
      cursor: pointer;
      text-align: left;
    }

    .accordion-content {
      display: none;
      background: white;
      border-radius: 0 0 18px 18px;
      padding: 18px;
    }

    .accordion-content.open {
      display: block;
    }

    input,
    textarea {
      width: 100%;
      min-height: 70px;
      padding: 15px;
      margin: 8px 0;
      border: 3px solid #087f8c;
      border-radius: 15px;
      font-size: 21px;
    }

    button.action,
    .phrase {
      width: 100%;
      min-height: 85px;
      margin: 7px 0;
      padding: 15px;
      border: none;
      border-radius: 16px;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #087f8c;
      color: white;
    }

    .yes {
      background: #16863b;
      color: white;
    }

    .no {
      background: #c62828;
      color: white;
    }

    .secondary {
      background: #e5edef;
      color: #10232a;
    }

    .danger {
      background: #b3261e;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .phrase-row {
      margin-bottom: 14px;
      padding: 10px;
      background: #f3f7f8;
      border-radius: 16px;
    }

    button:focus,
    input:focus,
    textarea:focus {
      outline: 7px solid #ffd600;
      outline-offset: 4px;
    }

    #app {
      display: none;
    }

    #userEmail {
      font-size: 17px;
      text-align: center;
      margin-bottom: 12px;
    }

    @media(max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 32px;
      }

      .accordion-button {
        min-height: 100px;
        font-size: 23px;
      }

      button.action,
      .phrase {
        min-height: 100px;
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

<main>

  <h1>👁️ Tonguebox</h1>
  <div class="subtitle">Sprich mit deinen Augen</div>

  <!-- LOGIN -->
  <section id="loginArea">

    <div class="status">
      🔐 Persönliches Tonguebox-Konto
    </div>

    <input
      id="email"
      type="email"
      placeholder="E-Mail-Adresse"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Passwort"
      autocomplete="current-password"
    >

    <button class="action primary" onclick="login()">
      🔓 Anmelden
    </button>

    <button class="action secondary" onclick="register()">
      👤 Neues Konto erstellen
    </button>

    <div id="loginMessage"></div>

  </section>


  <!-- APP -->
  <section id="app">

    <div class="status">
      ☁️ Tonguebox Cloud aktiv
    </div>

    <div id="userEmail"></div>


    <!-- JA / NEIN -->
    <div class="accordion">

      <button class="accordion-button" onclick="toggleAccordion(this)">
        ✅ Ja / Nein
      </button>

      <div class="accordion-content">

        <div class="grid">

          <button class="action yes" onclick="speak('Ja.')">
            JA
          </button>

          <button class="action no" onclick="speak('Nein.')">
            NEIN
          </button>

          <button class="action secondary" onclick="speak('Vielleicht.')">
            Vielleicht
          </button>

          <button class="action secondary"
                  onclick="speak('Bitte wiederholen.')">
            Wiederholen
          </button>

        </div>

      </div>
    </div>


    <!-- TEXT SPRECHEN -->
    <div class="accordion">

      <button class="accordion-button" onclick="toggleAccordion(this)">
        🔊 Text sprechen
      </button>

      <div class="accordion-content">

        <textarea
          id="speechText"
          rows="4"
          placeholder="Was möchtest du sagen?"
        ></textarea>

        <button class="action primary" onclick="speakOwnText()">
          🔊 Vorlesen
        </button>

      </div>
    </div>


    <!-- PERSÖNLICHE PHRASE -->
    <div class="accordion">

      <button class="accordion-button" onclick="toggleAccordion(this)">
        ➕ Eigene Phrase speichern
      </button>

      <div class="accordion-content">

        <textarea
          id="newPhrase"
          placeholder="Neue persönliche Phrase"
        ></textarea>

        <button class="action primary" onclick="savePhrase()">
          ☁️ In meiner Cloud speichern
        </button>

        <div id="saveMessage"></div>

      </div>
    </div>


    <!-- MEINE PHRASES -->
    <div class="accordion">

      <button class="accordion-button" onclick="openPhrases(this)">
        💬 Meine Phrasen
      </button>

      <div class="accordion-content">

        <div id="phrases">
          Lade Phrasen …
        </div>

      </div>
    </div>


    <!-- SOFORT KOMMUNIKATION -->
    <div class="accordion">

      <button class="accordion-button" onclick="toggleAccordion(this)">
        ⚡ Schnelle Kommunikation
      </button>

      <div class="accordion-content">

        <button class="phrase primary"
                onclick="speak('Einen Moment bitte.')">
          ⏳ Einen Moment bitte
        </button>

        <button class="phrase primary"
                onclick="speak('Bitte sprechen Sie langsamer.')">
          🐢 Bitte langsamer
        </button>

        <button class="phrase primary"
                onclick="speak('Bitte wiederholen Sie das.')">
          🔁 Bitte wiederholen
        </button>

        <button class="phrase primary"
                onclick="speak('Ich brauche bitte Hilfe.')">
          🙏 Ich brauche Hilfe
        </button>

        <button class="phrase primary"
                onclick="speak('Bitte stellen Sie mir eine Ja-oder-Nein-Frage.')">
          ❓ Ja/Nein-Frage stellen
        </button>

        <button class="phrase primary"
                onclick="speak('Ich kommuniziere über eine Augensteuerung.')">
          👁️ Ich kommuniziere mit Augensteuerung
        </button>

      </div>
    </div>


    <!-- KONTO -->
    <div class="accordion">

      <button class="accordion-button" onclick="toggleAccordion(this)">
        👤 Mein Konto
      </button>

      <div class="accordion-content">

        <button class="action danger" onclick="logout()">
          🚪 Abmelden
        </button>

      </div>
    </div>

  </section>

</main>


<script>

const SUPABASE_URL =
  "https://zuealgaycolrvtvrubiu.supabase.co";

const SUPABASE_KEY =
  "DEINE_SUPABASE_ANON_KEY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* -------------------------
   LOGIN
------------------------- */

async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "Anmeldung läuft …";

  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;
  }

  message.textContent = "";

  showApp(data.user);
}


/* -------------------------
   REGISTRIERUNG
------------------------- */

async function register() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  if (!email || !password) {

    message.textContent =
      "Bitte E-Mail und Passwort eingeben.";

    return;
  }

  const { data, error } =
    await supabaseClient.auth.signUp({
      email,
      password
    });

  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;
  }

  if (data.session) {

    showApp(data.user);

  } else {

    message.textContent =
      "✅ Konto erstellt. Bitte bestätige gegebenenfalls deine E-Mail.";

  }
}


/* -------------------------
   ABMELDEN
------------------------- */

async function logout() {

  await supabaseClient.auth.signOut();

  document.getElementById("app").style.display =
    "none";

  document.getElementById("loginArea").style.display =
    "block";

}


/* -------------------------
   APP ANZEIGEN
------------------------- */

function showApp(user) {

  document.getElementById("loginArea").style.display =
    "none";

  document.getElementById("app").style.display =
    "block";

  document.getElementById("userEmail").textContent =
    "👤 " + user.email;

}


/* -------------------------
   SESSION PRÜFEN
------------------------- */

async function checkSession() {

  const { data } =
    await supabaseClient.auth.getSession();

  if (data.session) {

    showApp(data.session.user);

  }

}

checkSession();


/* -------------------------
   PHRASE SPEICHERN
------------------------- */

async function savePhrase() {

  const input =
    document.getElementById("newPhrase");

  const message =
    document.getElementById("saveMessage");

  const phrase =
    input.value.trim();

  if (!phrase) {

    message.textContent =
      "Bitte zuerst einen Satz eingeben.";

    return;
  }

  const { data: userData } =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;

  if (!user) {

    message.textContent =
      "Bitte zuerst anmelden.";

    return;
  }

  message.textContent =
    "☁️ Wird gespeichert …";

  const { error } =
    await supabaseClient
      .from("Phrases")
      .insert({
        user_id: user.id,
        phrase: phrase
      });

  if (error) {

    message.textContent =
      "❌ " + error.message;

    return;
  }

  input.value = "";

  message.textContent =
    "✅ Phrase gespeichert.";

  await loadPhrases();

}


/* -------------------------
   PHRASES LADEN
------------------------- */

async function loadPhrases() {

  const container =
    document.getElementById("phrases");

  container.innerHTML =
    "☁️ Phrasen werden geladen …";

  const { data: userData } =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;

  if (!user) {

    container.innerHTML =
      "Bitte anmelden.";

    return;
  }

  const { data, error } =
    await supabaseClient
      .from("Phrases")
      .select("id, phrase, created_at")
      .eq("user_id", user.id)
      .order("created_at", {
        ascending: false
      });

  if (error) {

    container.textContent =
      "❌ " + error.message;

    return;
  }

  container.innerHTML = "";

  if (!data || data.length === 0) {

    container.textContent =
      "Noch keine eigenen Phrasen gespeichert.";

    return;
  }

  data.forEach(item => {

    const row =
      document.createElement("div");

    row.className =
      "phrase-row";


    const speakButton =
      document.createElement("button");

    speakButton.className =
      "phrase primary";

    speakButton.textContent =
      "🔊 " + item.phrase;

    speakButton.onclick =
      () => speak(item.phrase);


    const deleteButton =
      document.createElement("button");

    deleteButton.className =
      "action danger";

    deleteButton.textContent =
      "🗑️ Löschen";

    deleteButton.onclick =
      () => deletePhrase(item.id);


    row.appendChild(speakButton);
    row.appendChild(deleteButton);

    container.appendChild(row);

  });

}


/* -------------------------
   PHRASE LÖSCHEN
------------------------- */

async function deletePhrase(id) {

  const { data: userData } =
    await supabaseClient.auth.getUser();

  const user =
    userData.user;

  if (!user) return;

  const { error } =
    await supabaseClient
      .from("Phrases")
      .delete()
      .eq("id", id)
      .eq("user_id", user.id);

  if (error) {

    alert(error.message);

    return;
  }

  await loadPhrases();

}


/* -------------------------
   SPRACHAUSGABE
------------------------- */

function speak(text) {

  if (!text) return;

  window.speechSynthesis.cancel();

  const utterance =
    new SpeechSynthesisUtterance(text);

  utterance.lang =
    "de-AT";

  utterance.rate =
    0.95;

  window.speechSynthesis.speak(
    utterance
  );

}


function speakOwnText() {

  const text =
    document.getElementById("speechText")
      .value
      .trim();

  speak(text);

}


/* -------------------------
   AKKORDEON
------------------------- */

function toggleAccordion(button) {

  const content =
    button.nextElementSibling;

  const wasOpen =
    content.classList.contains("open");


  document
    .querySelectorAll(".accordion-content")
    .forEach(panel => {

      panel.classList.remove("open");

    });


  if (!wasOpen) {

    content.classList.add("open");

    setTimeout(() => {

      button.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

    }, 100);

  }

}


async function openPhrases(button) {

  toggleAccordion(button);

  const content =
    button.nextElementSibling;

  if (content.classList.contains("open")) {

    await loadPhrases();

  }

}


/* -------------------------
   AUTH ÄNDERUNGEN
------------------------- */

supabaseClient.auth.onAuthStateChange(
  (event, session) => {

    if (session?.user) {

      showApp(session.user);

    }

  }
);

</script>

</body>
</html>
