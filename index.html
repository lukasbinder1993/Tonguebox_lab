<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#07111f">

<title>E-Tongue – sprich mit deinen Augen</title>

<style>

:root{
  --bg:#07111f;
  --panel:#0d2940;
  --panel2:#123b5b;
  --panel3:#17516f;
  --accent:#35d6bd;
  --blue:#22abc8;
  --green:#16865a;
  --red:#aa3d49;
  --orange:#b97813;
  --purple:#6d55c7;
  --text:#fff;
  --muted:#c9d8e3;
  --yellow:#ffd166;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  font-size:19px;
  line-height:1.45;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

button:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible{
  outline:5px solid #fff;
  outline-offset:3px;
}

header{
  text-align:center;
  padding:22px 15px;
  background:#091725;
  border-bottom:2px solid var(--blue);
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:7px 0 0;
  color:var(--muted);
}

main{
  width:min(1200px,96%);
  margin:auto;
  padding-bottom:100px;
}


/* ZEIT */

.time-box{
  margin:20px 0;
  padding:18px;
  text-align:center;
  background:var(--panel);
  border:2px solid var(--blue);
  border-radius:20px;
}

#clock{
  color:var(--accent);
  font-size:29px;
  font-weight:bold;
}


/* SCHNELLKOMMUNIKATION */

.quick-title{
  text-align:center;
  color:var(--accent);
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
  margin-bottom:25px;
}

.quick{
  min-height:110px;
  border:4px solid transparent;
  border-radius:20px;
  color:white;
  font-size:27px;
  font-weight:bold;
}

.quick:hover{
  border-color:white;
}

.yes{
  background:var(--green);
}

.no{
  background:var(--red);
}

.normal{
  background:var(--panel2);
}


/* AKKORDEON */

.section{
  margin:20px 0;
  overflow:hidden;
  background:var(--panel);
  border:2px solid #245c7e;
  border-radius:20px;
}

.section-toggle{
  width:100%;
  min-height:105px;
  padding:20px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  border:0;
  background:var(--panel2);
  color:white;

  text-align:left;
  font-size:23px;
  font-weight:bold;
}

.section.open .section-toggle{
  background:var(--panel3);
}

.section-content{
  display:none;
  padding:20px;
}

.section.open .section-content{
  display:block;
}

.arrow{
  font-size:30px;
}


/* EINGABEN */

textarea,
input[type="text"],
input[type="tel"],
select{
  width:100%;
  padding:18px;
  border:3px solid var(--blue);
  border-radius:17px;
  background:white;
  color:#111;
  font-size:21px;
}

textarea{
  min-height:135px;
  resize:vertical;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}


/* AKTIONEN */

.actions{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-top:16px;
}

.action{
  min-height:100px;
  padding:15px;

  border:3px solid transparent;
  border-radius:18px;

  background:var(--accent);
  color:#05232b;

  font-size:21px;
  font-weight:bold;
}

.blue{
  background:var(--blue);
  color:white;
}

.green{
  background:var(--green);
  color:white;
}

.red{
  background:var(--red);
  color:white;
}

.purple{
  background:var(--purple);
  color:white;
}


/* PHRASEN */

.phrases{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.phrase{
  min-height:120px;
  padding:20px;

  border:3px solid transparent;
  border-radius:18px;

  background:var(--panel2);
  color:white;

  font-size:21px;
  text-align:left;
  line-height:1.35;
}

.phrase:hover{
  border-color:white;
}


/* THEMEN */

.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:15px;
}

.category{
  min-height:105px;
  padding:15px;

  border:3px solid transparent;
  border-radius:18px;

  background:var(--panel2);
  color:white;

  font-size:21px;
  font-weight:bold;
}

.category.active{
  background:var(--accent);
  color:#05232b;
}


/* STATUS */

.status{
  min-height:30px;
  margin-top:15px;
  color:var(--yellow);
  font-weight:bold;
}


/* EINSTELLUNGEN */

.setting{
  margin:25px 0;
}

input[type="range"]{
  width:100%;
  min-height:60px;
}


/* ==========================================
   TELEFON SCHNELLMODUS
========================================== */

.phone-mode{
  display:none;

  position:fixed;
  inset:0;

  z-index:999999;

  background:#07111f;

  overflow-y:auto;

  padding:
    max(12px,env(safe-area-inset-top))
    12px
    max(20px,env(safe-area-inset-bottom));
}

.phone-mode.active{
  display:block;
}

.phone-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;

  margin-bottom:14px;
}

.phone-title{
  font-size:25px;
  font-weight:bold;
}

.phone-subtitle{
  color:var(--muted);
  font-size:15px;
}

.phone-close{
  min-width:120px;
  min-height:75px;

  border:3px solid white;
  border-radius:17px;

  background:#263c4c;
  color:white;

  font-weight:bold;
}


/* GROSSE SCHNELLTASTEN */

.phone-main-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.phone-big{
  min-height:135px;

  border:4px solid transparent;
  border-radius:22px;

  color:white;

  font-size:30px;
  font-weight:bold;
}

.phone-big span{
  display:block;
  margin-top:5px;
  font-size:17px;
}

.phone-yes{
  background:var(--green);
}

.phone-no{
  background:var(--red);
}

.phone-wait{
  background:var(--orange);
}

.phone-repeat{
  background:#176b96;
}


/* ZWEITE REIHE */

.phone-secondary{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  margin-top:13px;
}

.phone-secondary button{
  min-height:105px;
  padding:12px;

  border:3px solid transparent;
  border-radius:18px;

  background:var(--panel2);
  color:white;

  font-size:19px;
  font-weight:bold;
}


/* TELEFON EINGABE */

.phone-input{
  margin-top:18px;
}

.phone-input textarea{
  min-height:105px;
}


/* TELEFON AKTION */

.phone-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px;
  margin-top:13px;
}

.phone-actions button{
  min-height:100px;
  border:3px solid transparent;
  border-radius:18px;
  color:white;
  font-size:21px;
  font-weight:bold;
}

.phone-speak{
  background:var(--accent);
  color:#05232b !important;
}

.phone-ai{
  background:var(--purple);
}


/* KI TELEFONANTWORTEN */

.phone-ai-results{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
  margin-top:14px;
}

.phone-ai-answer{
  min-height:125px;
  padding:16px;

  border:3px solid var(--accent);
  border-radius:18px;

  background:var(--panel2);
  color:white;

  font-size:20px;
  line-height:1.3;
  text-align:left;
}


/* LETZTE TELEFONANTWORTEN */

.phone-history-title{
  margin-top:22px;
}

.phone-history{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}

.phone-history-button{
  min-height:100px;
  padding:15px;

  border:3px solid #44677d;
  border-radius:18px;

  background:#102d43;
  color:white;

  font-size:18px;
  text-align:left;
}


/* ENDE */

.phone-end{
  width:100%;
  min-height:105px;
  margin-top:25px;

  border:4px solid white;
  border-radius:20px;

  background:var(--red);
  color:white;

  font-size:22px;
  font-weight:bold;
}


/* MOBILE */

@media(max-width:700px){

  header h1{
    font-size:28px;
  }

  .phrases{
    grid-template-columns:1fr;
  }

  .section-toggle{
    min-height:110px;
    font-size:21px;
  }

  .category{
    min-height:100px;
  }

}

@media(max-width:430px){

  .phone-big{
    min-height:125px;
    font-size:27px;
  }

  .phone-ai-results{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<script>

/* ========================================
   KONFIGURATION
======================================== */

/*
Für KI später deine Backend-Adresse:

const AI_URL =
"https://dein-backend.at/api/phrasen";

NIEMALS den OpenAI API-Key hier eintragen.
*/

const AI_URL =
"DEINE_BACKEND_URL/api/phrasen";


let currentCategory =
"Allgemein";

let voices = [];

let filteredVoices = [];


/* ========================================
   AKKORDEON
======================================== */

function toggleSection(button){

  const section =
  button.closest(".section");

  const open =
  section.classList.contains("open");


  document
  .querySelectorAll(".section")
  .forEach(item=>{

    item.classList.remove("open");

    const arrow =
    item.querySelector(".arrow");

    if(arrow){
      arrow.textContent="▼";
    }

  });


  if(!open){

    section.classList.add("open");

    button
    .querySelector(".arrow")
    .textContent="▲";


    setTimeout(()=>{

      section.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    },150);

  }

}


/* ========================================
   ZEIT
======================================== */

function getDaypart(){

  const hour =
  new Date().getHours();

  if(hour>=5 && hour<9)
  return "Morgen";

  if(hour>=9 && hour<12)
  return "Vormittag";

  if(hour>=12 && hour<14)
  return "Mittag";

  if(hour>=14 && hour<18)
  return "Nachmittag";

  if(hour>=18 && hour<22)
  return "Abend";

  return "Nacht";

}


function updateClock(){

  const now =
  new Date();


  document
  .getElementById("date")
  .textContent =
  now.toLocaleDateString(
    "de-AT",
    {
      weekday:"long",
      day:"2-digit",
      month:"long",
      year:"numeric"
    }
  );


  document
  .getElementById("clock")
  .textContent =
  now.toLocaleTimeString(
    "de-AT",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );


  document
  .getElementById("daypart")
  .textContent =
  getDaypart();

}


/* ========================================
   TAGESPHRASEN
======================================== */

const timeSentences={

Morgen:[
"Guten Morgen!",
"Wie hast du geschlafen?",
"Ich möchte frühstücken.",
"Ich hätte gerne einen Kaffee.",
"Was machen wir heute?",

Vormittag:[

"Was machen wir als Nächstes?",

Mittag:[

Nachmittag:[

/* ========================================
   PHRASEN DARSTELLEN
======================================== */

function renderPhrases(id,list){

  const container =
  document.getElementById(id);

  container.innerHTML="";


  if(!list || !list.length){

    container.innerHTML =
    "<p>Keine Sätze vorhanden.</p>";

    return;

  }


  list.forEach(text=>{

    const button =
    document.createElement("button");

    button.className="phrase";

    button.textContent =
    "🔊 " + text;

    button.onclick=()=>
    speak(text);

    container.appendChild(button);

  });

}


/* ========================================
   THEMA
======================================== */

function selectCategory(category,button){

  currentCategory=category;


  document
  .querySelectorAll(".category")
  .forEach(item=>
    item.classList.remove("active")
  );


  if(button){
    button.classList.add("active");
  }


  document
  .getElementById("categoryTitle")
  .textContent =
  "💡 " + category;


  renderPhrases(
    "categoryPhrases",
    categories[category]
  );

}


/* ========================================
   STIMMEN
======================================== */

function loadVoices(){

  voices =
  speechSynthesis.getVoices();

  filterVoices();

}


function filterVoices(){

  const search =
  document
  .getElementById("voiceSearch")
  .value
  .toLowerCase()
  .trim();


  filteredVoices =
  voices.filter(voice=>{

    const text =
    (
      voice.name +
      " " +
      voice.lang
    ).toLowerCase();

    return(
      !search ||
      text.includes(search)
    );

  });


  filteredVoices.sort((a,b)=>{

    const aa =
    a.lang.toLowerCase()
    .startsWith("de") ? 0 : 1;

    const bb =
    b.lang.toLowerCase()
    .startsWith("de") ? 0 : 1;

    return aa-bb;

  });


  const select =
  document.getElementById("voices");

  select.innerHTML="";


  filteredVoices.forEach(
    (voice,index)=>{

      const option =
      document.createElement("option");

      option.value=index;

      option.textContent =
      voice.name +
      " – " +
      voice.lang;

      select.appendChild(option);

    }
  );


  restoreVoice();

}


function restoreVoice(){

  const saved =
  localStorage.getItem(
    "etongue_voice"
  );


  const select =
  document.getElementById("voices");


  if(saved){

    const index =
    filteredVoices.findIndex(
      voice=>voice.name===saved
    );

    if(index>=0){

      select.value=index;

      return;

    }

  }


  const german =
  filteredVoices.findIndex(
    voice=>
    voice.lang
    .toLowerCase()
    .startsWith("de")
  );


  if(german>=0){
    select.value=german;
  }

}


function getSelectedVoice(){

  const index =
  Number(
    document
    .getElementById("voices")
    .value
  );

  return(
    filteredVoices[index] ||
    null
  );

}


/* ========================================
   SPRECHEN
======================================== */

function speak(text){

  if(!text || !text.trim())
  return;


  speechSynthesis.cancel();


  const utterance =
  new SpeechSynthesisUtterance(text);


  const voice =
  getSelectedVoice();


  if(voice){

    utterance.voice=voice;
    utterance.lang=voice.lang;

  }else{

    utterance.lang="de-AT";

  }


  utterance.volume =
  Number(
    document
    .getElementById("volume")
    .value
  );


  utterance.rate =
  Number(
    document
    .getElementById("rate")
    .value
  );


  speechSynthesis.speak(
    utterance
  );


  addHistory(text);

}

/* ========================================
   KI
======================================== */

async function requestAI(
context="",
mode="normal"
){

  if(
    AI_URL.includes(
      "DEINE_BACKEND_URL"
    )
  ){

    throw new Error(
      "Backend nicht eingerichtet"
    );

  }


  const now=new Date();


  const response =
  await fetch(
    AI_URL,
    {
      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        thema:
        mode==="phone"
        ? "Telefon"
        : currentCategory,

        kontext:context,

        modus:mode,

        tageszeit:
        getDaypart(),

        wochentag:
        now.toLocaleDateString(
          "de-AT",
          {weekday:"long"}
        ),

        datum:
        now.toLocaleDateString(
          "de-AT"
        ),

        uhrzeit:
        now.toLocaleTimeString(
          "de-AT",
          {
            hour:"2-digit",
            minute:"2-digit"
          }
        )

      })
    }
  );


  if(!response.ok){

    throw new Error(
      "KI Serverfehler"
    );

  }


  const data =
  await response.json();


  if(
    !Array.isArray(data.phrasen)
  ){

    throw new Error(
      "Ungültige Antwort"
    );

  }


  return data.phrasen;

}


/* ========================================
   NORMALE KI
======================================== */

async function generateAI(){

  const status =
  document.getElementById("aiStatus");


  const context =
  document
  .getElementById("mainText")
  .value
  .trim();


  status.textContent =
  "🤖 KI erstellt Vorschläge ...";


  try{

    const result =
    await requestAI(
      context,
      "normal"
    );


    renderPhrases(
      "aiPhrases",
      result
    );


    status.textContent =
    "✓ Vorschläge bereit.";

  }

  catch(error){

    renderPhrases(
      "aiPhrases",
      categories[currentCategory]
    );


    status.textContent =
    "KI nicht erreichbar – lokale Vorschläge werden angezeigt.";

  }

}


/* ========================================
   FAVORITEN
======================================== */

function saveSentence(){

  const text =
  document
  .getElementById("mainText")
  .value
  .trim();


  if(!text)
  return;


  let list =
  JSON.parse(
    localStorage.getItem(
      "etongue_favorites"
    ) || "[]"
  );


  list =
  list.filter(
    item=>item!==text
  );


  list.unshift(text);


  localStorage.setItem(
    "etongue_favorites",
    JSON.stringify(list)
  );


  loadFavorites();

}


function loadFavorites(){

  const list =
  JSON.parse(
    localStorage.getItem(
      "etongue_favorites"
    ) || "[]"
  );


  renderPhrases(
    "favorites",
    list
  );

}


/* ========================================
   NORMALER VERLAUF
======================================== */

function addHistory(text){

  let list =
  JSON.parse(
    localStorage.getItem(
      "etongue_history"
    ) || "[]"
  );


  list =
  list.filter(
    item=>item!==text
  );


  list.unshift(text);

  list=list.slice(0,20);


  localStorage.setItem(
    "etongue_history",
    JSON.stringify(list)
  );


  loadHistory();

}


function loadHistory(){

  const list =
  JSON.parse(
    localStorage.getItem(
      "etongue_history"
    ) || "[]"
  );


  renderPhrases(
    "history",
    list
  );

}


function clearHistory(){

  localStorage.removeItem(
    "etongue_history"
  );

  loadHistory();

}


/* ========================================
   TELEFONANRUF
======================================== */

function startCall(){

  const number =
  document
  .getElementById("phoneNumber")
  .value
  .trim();


  if(!number){

    alert(
      "Bitte Telefonnummer eingeben."
    );

    return;

  }


  const clean =
  number.replace(
    /[^0-9+*#]/g,
    ""
  );


  window.location.href =
  "tel:" + clean;

}

   SCHNELLMODUS
======================================== */

function openPhoneMode(){

  const mode =
  document.getElementById("phoneMode");

  mode.classList.add("active");

  document.body.style.overflow =
  "hidden";

  mode.scrollTop=0;

  loadPhoneHistory();

}


function closePhoneMode(){

  document
  .getElementById("phoneMode")
  .classList.remove("active");

  document.body.style.overflow="";

}


/* ========================================
   TELEFON SPRECHEN
======================================== */

function phoneSpeak(text){

  speak(text);

  addPhoneHistory(text);

}


/* ========================================
   EIGENER TELEFONTEXT
======================================== */

function speakPhoneText(){

  const text =
  document
  .getElementById("phoneText")
  .value
  .trim();


  if(!text)
  return;


  phoneSpeak(text);

}


/* ========================================
   TELEFON KI
======================================== */

async function generatePhoneAI(){

  const input =
  document
  .getElementById("phoneText");


  const status =
  document
  .getElementById("phoneAIStatus");


  const button =
  document
  .getElementById("phoneAIButton");


  const text =
  input.value.trim();


  if(!text){

    status.textContent =
    "Bitte ein paar Stichwörter eingeben.";

    return;

  }


  button.disabled=true;

  button.textContent =
  "⏳ KI DENKT ...";


  status.textContent =
  "Kurze Antworten werden erstellt ...";


  try{

    const answers =
    await requestAI(
      text,
      "phone"
    );


    renderPhoneAI(
      answers.slice(0,4)
    );


    status.textContent =
    "✓ Antwort ansehen und auswählen.";

  }

  catch(error){

    const fallback=[

      "Ja, das passt für mich.",

      "Nein, das passt für mich leider nicht.",

      "Können wir einen anderen Termin vereinbaren?",

      "Einen Moment bitte."

    ];


    renderPhoneAI(
      fallback
    );


    status.textContent =
    "KI momentan nicht erreichbar – Schnellantworten werden angezeigt.";

  }

  finally{

    button.disabled=false;

    button.textContent =
    "🤖 KI-ANTWORTEN";

  }

}


/* ========================================
   KI ANTWORTEN DARSTELLEN
======================================== */

function renderPhoneAI(list){

  const container =
  document.getElementById(
    "phoneAIResults"
  );


  container.innerHTML="";


  list
  .slice(0,4)
  .forEach(text=>{

    const button =
    document.createElement("button");


    button.className =
    "phone-ai-answer";


    button.textContent =
    "🔊 " + text;


    button.onclick=()=>{

      phoneSpeak(text);

    };


    container.appendChild(button);

  });

}


/* ========================================
   TELEFONVERLAUF
======================================== */

function addPhoneHistory(text){

  let list =
  JSON.parse(
    localStorage.getItem(
      "etongue_phone_history"
    ) || "[]"
  );


  list =
  list.filter(
    item=>item!==text
  );


  list.unshift(text);


  /*
  Im Schnellmodus nur
  die letzten 6 Antworten.
  */

  list=list.slice(0,6);


  localStorage.setItem(
    "etongue_phone_history",
    JSON.stringify(list)
  );


  loadPhoneHistory();

}


function loadPhoneHistory(){

  const list =
  JSON.parse(
    localStorage.getItem(
      "etongue_phone_history"
    ) || "[]"
  );


  const container =
  document.getElementById(
    "phoneHistory"
  );


  container.innerHTML="";


  if(list.length===0){

    container.innerHTML =
    "<p>Noch keine Telefonantworten.</p>";

    return;

  }


  list.forEach(text=>{

    const button =
    document.createElement("button");


    button.className =
    "phone-history-button";


    button.textContent =
    "🔊 " + text;


    button.onclick=()=>{

      phoneSpeak(text);

    };


    container.appendChild(button);

  });

}

});

"change",
function(){

  );

});


document
.getElementById("rate")
.addEventListener(
"change",
function(){

  localStorage.setItem(
    "etongue_rate",
    this.value
  );

});


function loadSettings(){

  const volume =
  localStorage.getItem(
    "etongue_volume"
  );


  const rate =
  localStorage.getItem(
    "etongue_rate"
  );


  if(volume!==null){

    document
    .getElementById("volume")
    .value=volume;

  }


  if(rate!==null){

    document
    .getElementById("rate")
    .value=rate;

  }

}

   START
======================================== */

function start(){

  updateClock();

  loadSettings();

  loadVoices();

  loadFavorites();

  loadHistory();

  loadPhoneHistory();


  renderPhrases(
    "timePhrases",
    timeSentences[
      getDaypart()
    ]
  );


  selectCategory(
    "Allgemein",
    document.querySelector(
      ".category"
    )
  );


  setInterval(
    updateClock,
    30000
  );


  setInterval(
    ()=>{

      renderPhrases(
        "timePhrases",
        timeSentences[
          getDaypart()
        ]
      );

    },
    300000
  );

}


speechSynthesis.onvoiceschanged =
loadVoices;


window.addEventListener(
"load",
start
);
