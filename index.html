<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonguebox – Benutzerkonto</title>
<style>
:root{font-family:Arial,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111f;color:#fff}main{max-width:760px;margin:auto;padding:22px 16px 60px}h1{text-align:center;font-size:2rem}p{line-height:1.5}a{color:#62ead4}section{background:#0d2940;border:2px solid #35d6bd;border-radius:20px;padding:20px;margin:20px 0}label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;min-height:68px;font-size:1.2rem;padding:12px;border-radius:12px;border:3px solid #35d6bd;background:#fff;color:#111}button{width:100%;min-height:84px;margin-top:18px;padding:14px;background:#35d6bd;color:#09212c;border:0;border-radius:16px;font-size:1.25rem;font-weight:bold;cursor:pointer}button.secondary{background:#204a67;color:#fff}button:disabled{opacity:.6}button:focus-visible,input:focus-visible,a:focus-visible{outline:5px solid #ffd166;outline-offset:3px}.status{min-height:32px;margin-top:14px;font-weight:bold;overflow-wrap:anywhere}.hidden{display:none}.links{text-align:center}small{display:block;color:#d6e4ec;margin-top:12px}
.forgot-link{display:block;margin:18px 0;padding:18px;text-align:center;font-size:1.2rem;color:#7ce5dc;border:2px solid #37d3c2;border-radius:14px} </style>
</head>
<body>
<main>
<h1>👁️ Tonguebox</h1>
<p style="text-align:center">Dein Benutzerkonto – sprich mit deinen Augen</p>
<div class="links"><a href="./index.html">← Zurück zu Tonguebox</a></div>
<section id="account" class="hidden">
<h2>✓ Angemeldet</h2>
<p id="welcome"></p>
<button id="logout">Abmelden</button>
<a href="./Tonguebox_Synchronisierung_korrigiert.html">Tonguebox öffnen</a>
</section>
<section id="loginSection">
<h2>Anmelden</h2>
<form id="loginForm">
<label for="login">Benutzername oder E-Mail</label>
<input id="login" name="login" autocomplete="username" required>
<label for="loginPassword">Passwort</label>
<input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
<button type="submit">🔓 ANMELDEN</button>
</form>
<a class="forgot-link" href="./passwort-vergessen.html">🔑 Passwort vergessen?</a>
<button class="secondary" id="showRegister">Noch kein Konto? Registrieren</button>
<div class="status" id="loginStatus" role="status" aria-live="polite"></div>
</section>
<section id="registerSection" class="hidden">
<h2>Registrieren</h2>
<form id="registerForm">
<label for="username">Benutzername</label>
<input id="username" name="username" minlength="3" maxlength="50" autocomplete="username" required>
<label for="email">E-Mail-Adresse</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<label for="registerPassword">Passwort (mindestens 10 Zeichen)</label>
<input id="registerPassword" name="password" type="password" minlength="10" autocomplete="new-password" required>
<button type="submit">✓ KONTO ERSTELLEN</button>
</form>
<button class="secondary" id="showLogin">Bereits ein Konto? Anmelden</button>
<div class="status" id="registerStatus" role="status" aria-live="polite"></div>
<small>Mit der Registrierung wird noch keine E-Mail-Verifizierung durchgeführt. Verwende vorerst ein Testkonto.</small>
</section>
<p id="globalStatus" role="status" aria-live="polite"></p>
</main>
<script>
const API='https://api.e-tongue.com';
const TONGUEBOX_URL='./Tonguebox_Synchronisierung_korrigiert.html';
const $=id=>document.getElementById(id);
function show(mode){$('account').classList.toggle('hidden',mode!=='account');$('loginSection').classList.toggle('hidden',mode!=='login');$('registerSection').classList.toggle('hidden',mode!=='register')}
async function call(path,body){
 const options={method:body?'POST':'GET',credentials:'include',headers:{'Content-Type':'application/json'}};
 if(body)options.body=JSON.stringify(body);
 const response=await fetch(API+'/'+path,options);
 const data=await response.json();
 if(!response.ok||data.success===false)throw Error(data.error||'Anfrage fehlgeschlagen');
 return data;
}
function signedIn(user){$('welcome').textContent='Willkommen, '+user.username+'!';show('account')}
async function checkAccount(){try{const data=await call('account.php');if(data.authenticated&&data.user)signedIn(data.user);else show('login')}catch(e){show('login');$('globalStatus').textContent='Verbindung zum Benutzerkonto derzeit nicht möglich: '+e.message}}
async function submitForm(event,path,statusId,fields){event.preventDefault();const form=event.currentTarget;const button=form.querySelector('button[type=submit]');button.disabled=true;$(statusId).textContent='Bitte warten …';try{const body={};for(const field of fields)body[field]=form.elements.namedItem(field).value;const data=await call(path,body);form.reset();$(statusId).textContent='Erfolgreich.';signedIn(data.user);window.location.assign(TONGUEBOX_URL)}catch(e){$(statusId).textContent=e.message}finally{button.disabled=false}}
$('loginForm').addEventListener('submit',e=>submitForm(e,'login.php','loginStatus',['login','password']));
$('registerForm').addEventListener('submit',e=>submitForm(e,'register.php','registerStatus',['username','email','password']));
$('showRegister').addEventListener('click',()=>show('register'));
$('showLogin').addEventListener('click',()=>show('login'));
$('logout').addEventListener('click',async()=>{try{await call('logout.php',{});show('login');$('globalStatus').textContent='Du bist abgemeldet.'}catch(e){$('globalStatus').textContent=e.message}});
checkAccount();
</script>
</body>
</html>
