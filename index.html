<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>E-Tongue – Intelligente Phrasenvorschläge</title>

<style>
:root {
    --bg: #07111f;
    --panel: #103958;
    --panel2: #0d2e49;
    --accent: #32d4bd;
    --accent2: #21a9c7;
    --text: #ffffff;
    --muted: #d8e4ee;
    --danger: #ff6b6b;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: Arial, Helvetica, sans-serif;
    font-size: 20px;
}

header {
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid var(--accent2);
}

header h1 {
    margin: 0;
    font-size: 38px;
}

header p {
    color: var(--muted);
    margin-bottom: 0;
}

.container {
    width: min(1400px, 96%);
    margin: 25px auto;
}

.status {
    background: var(--panel2);
    border: 2px solid var(--accent2);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 25px;
    text-align: center;
}

.status strong {
    color: var(--accent);
}

h2 {
    color: var(--accent);
    margin-top: 35px;
}

/* Blicksteuerungsfreundliche Buttons */

button {
    font-family: inherit;
    cursor: pointer;
    border: 3px solid transparent;
    transition: 0.15s;
}

button:hover,
button:focus {
    border-color: white;
    transform: scale(1.02);
    outline: none;
}

.themen {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 16px;
}

.thema {
    min-height: 110px;
    border-radius: 15px;
    background: var(--panel);
    color: white;
    font-size: 23px;
    font-weight: bold;
}

.thema.active {
    background: var(--accent);
    color: #06202a;
}

/* KI / Phrasen */

.phrasen {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.phrase {
    min-height: 125px;
    padding: 22px;
    border-radius: 16px;
    background: var(--panel);
    color: white;
    font-size: 24px;
    text-align: left;
    line-height: 1.35;
}

.phrase::before {
    content: "🔊";
    margin-right: 12px;
}

/* Texteingabe */

.eingabe {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

textarea {
    flex: 1;
    min-width: 280px;
    min-height: 120px;
    padding: 18px;
    border-radius: 14px;
    border: 3px solid var(--accent2);
    background: white;
    color: #111;
    font-size: 22px;
    resize: vertical;
}

.action {
    min-width: 190px;
    min-height: 90px;
    border-radius: 14px;
    background: var(--accent);
    color: #052029;
    font-size: 21px;
    font-weight: bold;
}

.secondary {
    background: var(--accent2);
    color: white;
}

/* Stimme */

select {
    width: 100%;
    min-height: 65px;
    font-size: 20px;
    padding: 10px;
    border-radius: 10px;
}

/* Eigene Sätze */

.saved {
    margin-top: 15px;
}

/* Responsive */

@media (max-width: 800px) {

    body {
        font-size: 18px;
    }

    header h1 {
        font-size: 28px;
    }

    .phrasen {
        grid-template-columns: 1fr;
    }

    .phrase {
        min-height: 110px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 E-Tongue</h1>
    <p>Intelligente, tageszeitabhängige Kommunikation</p>
</header>

<main class="container">

    <!-- ZEIT -->

    <div class="status">
        <div id="datum"></div>
        <div id="uhrzeit"></div>

        <p>
            Aktuelle Tageszeit:
            <strong id="tageszeit"></strong>
        </p>
    </div>


    <!-- AUTOMATISCHE VORSCHLÄGE -->

    <h2>✨ Vorschläge für jetzt</h2>

    <div id="autoPhrasen" class="phrasen"></div>


    <!-- THEMEN -->

    <h2>💬 Thema auswählen</h2>

    <div class="themen">

        <button class="thema" onclick="waehleThema('Allgemein', this)">
            💬 Allgemein
        </button>

        <button class="thema" onclick="waehleThema('Kaffee', this)">
            ☕ Kaffee
        </button>

        <button class="thema" onclick="waehleThema('Trinken', this)">
            🥤 Trinken
        </button>

        <button class="thema" onclick="waehleThema('Essen', this)">
            🍽️ Essen
        </button>

        <button class="thema" onclick="waehleThema('Schmerzen', this)">
            🩺 Schmerzen
        </button>

        <button class="thema" onclick="waehleThema('Befinden', this)">
            ❤️ Befinden
        </button>

        <button class="thema" onclick="waehleThema('Unterhaltung', this)">
            🗣️ Unterhaltung
        </button>

        <button class="thema" onclick="waehleThema('Hilfe', this)">
            🆘 Hilfe
        </button>

        <button class="thema" onclick="waehleThema('Pflege', this)">
            🛏️ Pflege
        </button>

        <button class="thema" onclick="waehleThema('Fragen', this)">
            ❓ Fragen
        </button>

    </div>


    <h2 id="themaTitel">💡 Allgemeine Vorschläge</h2>

    <div id="themenPhrasen" class="phrasen"></div>


    <!-- FREIER TEXT -->

    <h2>✍️ Eigener Text</h2>

    <div class="eingabe">

        <textarea
            id="text"
            placeholder="Was möchtest du sagen?"
        ></textarea>

        <button class="action" onclick="sprecheTextfeld()">
            🔊 Vorlesen
        </button>

        <button class="action secondary" onclick="speichern()">
            ⭐ Satz speichern
        </button>

    </div>


    <!-- GESPEICHERTE SÄTZE -->

    <h2>⭐ Meine Sätze</h2>

    <div id="gespeichert" class="phrasen saved"></div>


    <!-- STIMME -->

    <h2>🗣️ Stimme</h2>

    <select id="stimmen"></select>

</main>


<script>

/* =========================================================
   E-TONGUE
   Tageszeitabhängige Phrasenvorschläge
========================================================= */

let aktuellesThema = "Allgemein";
let stimmen = [];


/* =========================================================
   ZEIT
========================================================= */

function getTageszeit() {

    const stunde = new Date().getHours();

    if (stunde >= 5 && stunde < 9)
        return "Morgen";

    if (stunde >= 9 && stunde < 12)
        return "Vormittag";

    if (stunde >= 12 && stunde < 14)
        return "Mittag";

    if (stunde >= 14 && stunde < 18)
        return "Nachmittag";

    if (stunde >= 18 && stunde < 22)
        return "Abend";

    return "Nacht";
}


function aktualisiereZeit() {

    const jetzt = new Date();

    document.getElementById("datum").textContent =
        jetzt.toLocaleDateString("de-AT", {
            weekday: "long",
            day: "2-digit",
            month: "long",
            year: "numeric"
        });

    document.getElementById("uhrzeit").textContent =
        jetzt.toLocaleTimeString("de-AT", {
            hour: "2-digit",
            minute: "2-digit"
        });

    document.getElementById("tageszeit").textContent =
        getTageszeit();
}


/* =========================================================
   PHRASEN-DATENBANK
========================================================= */

const phrasen = {

Allgemein: [
"Guten Morgen!",
"Wie hast du geschlafen?",
"Mir geht es heute gut.",
"Ich brauche noch etwas Zeit.",
"Was machen wir heute?",
"Ich freue mich auf den Tag."
],

Kaffee: [

"Der Kaffee ist genau richtig.",

"Ich möchte keinen Kaffee."
],

"Bitte gib mir Wasser.",
"Ich habe Durst.",
"Bitte noch einen Schluck.",
"Das reicht, danke.",
"Ich möchte später etwas trinken."
],

"Was gibt es zum Frühstück?",
"Ich habe Hunger.",
"Das schmeckt gut.",
"Bitte noch etwas.",
"Ich bin satt."
],

Unterhaltung: [
"Guten Morgen, wie geht es dir?",
"Was gibt es Neues?",
"Wie wird dein Tag?",
"Was machen wir heute?",
"Erzähl mir etwas.",
"Schön, dich zu sehen."
]

},


Vormittag: {

Allgemein: [
"Wie geht es dir?",
"Was machen wir als Nächstes?",
"Ich brauche eine kurze Pause.",
"Ich möchte etwas sagen.",

"Alles in Ordnung."
],

Kaffee: [

"Zeit für eine Kaffeepause.",
"Bitte einen Kaffee.",
"Möchtest du auch einen Kaffee?",
"Der Kaffee schmeckt gut.",
"Ich möchte noch einen Kaffee."
],

Essen: [
"Ich bekomme langsam Hunger.",
"Was gibt es heute zu essen?",
"Wann gibt es Mittagessen?",
"Ich möchte eine Kleinigkeit essen.",
"Das klingt gut.",
"Ich möchte später essen."
]

},


Mittag: {

Allgemein: [
"Wie war dein Vormittag?",
"Was machen wir nach dem Essen?",
"Ich brauche eine Pause.",
"Mir geht es gut.",
"Ich möchte etwas erzählen.",
"Wie geht es weiter?"
],

Essen: [
"Ich habe Hunger.",
"Was gibt es zum Mittagessen?",
"Das sieht gut aus.",
"Bitte noch etwas.",
"Das schmeckt sehr gut.",
"Ich bin satt."
],

"Ich hätte gerne etwas zu trinken.",
"Bitte Wasser.",
"Ich habe Durst.",

"Das reicht.",
"Danke."
]

},


Nachmittag: {

Allgemein: [
"Wie war dein Tag bisher?",
"Was machen wir heute noch?",
"Ich hätte gerne eine Pause.",
"Ich möchte etwas trinken.",
"Erzähl mir etwas.",
"Mir geht es gut."
],

Kaffee: [
"Ich hätte gerne einen Kaffee.",
"Zeit für einen Nachmittagskaffee.",
"Möchtest du mit mir Kaffee trinken?",
"Bitte mach mir einen Kaffee.",

],

Unterhaltung: [

]

},


Abend: {

Allgemein: [
"Guten Abend!",
"Wie war dein Tag?",
"Ich möchte mich entspannen.",
"Was machen wir heute Abend?",
"Ich bin müde.",
"Der Tag war schön."
],

Essen: [
"Was gibt es zum Abendessen?",
"Ich habe Hunger.",
"Das schmeckt gut.",
"Bitte noch etwas.",
"Ich möchte nichts mehr.",
"Ich bin satt."
],

Unterhaltung: [
"Wie war dein Tag?",
"Was war heute besonders?",
"Erzähl mir von deinem Tag.",
"Was machen wir morgen?",
"Das war ein schöner Tag.",
"Gute Nacht später."
]

},


Nacht: {

Allgemein: [

],

"Bitte komm zu mir.",

"Ich brauche etwas zu trinken.",
"Bitte mach das Licht an."
]

}

};


/* =========================================================
   STANDARD-PHRASEN
========================================================= */

const standardPhrasen = {

Schmerzen: [
"Ich habe Schmerzen.",
"Die Schmerzen sind stärker geworden.",
"Bitte ändere meine Position.",
"Ich brauche Hilfe.",
"Bitte warte einen Moment.",
"Ich möchte zeigen, wo es weh tut."
],

Befinden: [
"Mir geht es gut.",
"Mir geht es heute nicht so gut.",
"Ich bin müde.",
"Ich fühle mich wohl.",
"Ich brauche eine Pause.",
"Ich möchte etwas erzählen."
],

Hilfe: [
"Ich brauche Hilfe.",
"Bitte komm zu mir.",
"Bitte warte kurz.",
"Kannst du mir helfen?",
"Bitte ändere meine Position.",
"Danke für deine Hilfe."
],

Pflege: [
"Bitte ändere meine Position.",
"Ich möchte anders sitzen.",
"Bitte richte mich etwas auf.",

"Das passt so, danke."
],

Fragen: [
"Wie geht es dir?",
"Was machen wir jetzt?",
"Wann geht es weiter?",
"Kannst du mir das erklären?",
"Was meinst du damit?",
"Kannst du das wiederholen?"
],

Trinken: [
"Ich habe Durst.",
"Ich möchte Wasser.",
"Bitte gib mir etwas zu trinken.",
"Bitte noch einen Schluck.",
"Das reicht, danke.",
"Ich möchte später trinken."
],

Essen: [
"Ich habe Hunger.",
"Ich möchte etwas essen.",
"Was gibt es zu essen?",
"Das schmeckt gut.",
"Bitte noch etwas.",
"Ich bin satt."
],

Kaffee: [
"Ich hätte gerne einen Kaffee.",
"Bitte mach mir einen Kaffee.",
"Der Kaffee schmeckt gut.",
"Bitte noch einen Kaffee.",
"Möchtest du auch einen Kaffee?",
"Ich möchte keinen Kaffee."
],

Unterhaltung: [
"Wie geht es dir?",
"Was gibt es Neues?",
"Erzähl mir mehr.",
"Das ist interessant.",
"Was meinst du dazu?",
"Ich möchte dir etwas erzählen."
],

Allgemein: [
"Ja.",
"Nein.",
"Bitte.",
"Danke.",
"Moment bitte.",
"Ich möchte etwas sagen."
]

};


/* =========================================================
   PASSENDE PHRASEN HOLEN
========================================================= */

function holePhrasen(thema) {

    const tageszeit = getTageszeit();

    if (
        phrasen[tageszeit] &&
        phrasen[tageszeit][thema]
    ) {
        return phrasen[tageszeit][thema];
    }

    if (standardPhrasen[thema]) {
        return standardPhrasen[thema];
    }

    return standardPhrasen.Allgemein;
}


/* =========================================================
   AUTOMATISCHE STARTVORSCHLÄGE
========================================================= */

function zeigeAutoPhrasen() {

    const tageszeit = getTageszeit();

    let liste =
        phrasen[tageszeit]?.Allgemein ||
        standardPhrasen.Allgemein;

    renderPhrasen(
        "autoPhrasen",
        liste
    );
}


/* =========================================================
   THEMA AUSWÄHLEN
========================================================= */

function waehleThema(thema, button) {

    aktuellesThema = thema;

    document
        .querySelectorAll(".thema")
        .forEach(btn => btn.classList.remove("active"));

    if (button)
        button.classList.add("active");

    document.getElementById("themaTitel").textContent =
        "💡 " + thema + " – passende Vorschläge";

    const liste = holePhrasen(thema);

    renderPhrasen(
        "themenPhrasen",
        liste
    );
}


/* =========================================================
   PHRASEN ANZEIGEN
========================================================= */

function renderPhrasen(elementId, liste) {

    const container =
        document.getElementById(elementId);

    container.innerHTML = "";

    liste.forEach(text => {

        const button =
            document.createElement("button");

        button.className = "phrase";

        button.textContent = text;

        button.onclick = () => sprechen(text);

        container.appendChild(button);

    });
}


/* =========================================================
   TEXT TO SPEECH
========================================================= */

function ladenStimmen() {

    stimmen =
        window.speechSynthesis.getVoices();

    const select =
        document.getElementById("stimmen");

    select.innerHTML = "";

    stimmen.forEach((stimme, index) => {

        const option =
            document.createElement("option");

        option.value = index;

        option.textContent =
            stimme.name + " – " + stimme.lang;

        if (stimme.lang.startsWith("de"))
            option.selected = true;

        select.appendChild(option);

    });
}


function sprechen(text) {

    if (!text)
        return;

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    const index =
        document.getElementById("stimmen").value;

    if (stimmen[index])
        utterance.voice = stimmen[index];

    utterance.lang = "de-DE";

    utterance.rate = 1;

    window.speechSynthesis.speak(utterance);
}


function sprecheTextfeld() {

    const text =
        document.getElementById("text").value.trim();

    sprechen(text);
}


/* =========================================================
   EIGENE SÄTZE SPEICHERN
========================================================= */

function speichern() {

    const feld =
        document.getElementById("text");

    const text =
        feld.value.trim();

    if (!text)
        return;

    let gespeichert =
        JSON.parse(
            localStorage.getItem("etongue_saetze") || "[]"
        );

    if (!gespeichert.includes(text)) {
        gespeichert.push(text);
    }

    localStorage.setItem(
        "etongue_saetze",
        JSON.stringify(gespeichert)
    );

    feld.value = "";

    ladeGespeicherte();
}


function ladeGespeicherte() {

    const gespeichert =
        JSON.parse(
            localStorage.getItem("etongue_saetze") || "[]"
        );

    const container =
        document.getElementById("gespeichert");

    container.innerHTML = "";

    if (gespeichert.length === 0) {

        container.innerHTML =
            "<p>Noch keine eigenen Sätze gespeichert.</p>";

        return;
    }

    gespeichert.forEach(text => {

        const button =
            document.createElement("button");

        button.className = "phrase";

        button.textContent = text;

        button.onclick =
            () => sprechen(text);

        container.appendChild(button);

    });
}


/* =========================================================
   START
========================================================= */

function start() {

    aktualisiereZeit();

    zeigeAutoPhrasen();

    waehleThema(
        "Allgemein",
        document.querySelector(".thema")
    );

    ladeGespeicherte();

    ladenStimmen();

    setInterval(
        aktualisiereZeit,
        30000
    );
}


window.speechSynthesis.onvoiceschanged =
    ladenStimmen;

window.addEventListener(
    "load",
    start
);

</script>

</body>
</html>
