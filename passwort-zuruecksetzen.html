<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neues Passwort – Tonguebox</title><style>:root{color-scheme:dark}body{font:1.15rem/1.5 system-ui,sans-serif;background:#0b1830;color:white;margin:0;padding:24px}main{max-width:650px;margin:4vh auto;background:#162844;border-radius:22px;padding:clamp(20px,5vw,40px)}h1{font-size:clamp(1.6rem,5vw,2.2rem)}label{display:block;font-weight:700;margin:22px 0 8px}input,button{box-sizing:border-box;width:100%;min-height:64px;font:inherit;border-radius:14px;padding:14px 18px}input{background:white;color:#14213a;border:3px solid #91c9d3}button{margin-top:22px;background:#32b6ac;color:#071c2b;font-weight:800;border:0;cursor:pointer}button:focus-visible,input:focus-visible,a:focus-visible{outline:4px solid #ffe08a;outline-offset:4px}button:disabled{opacity:.7}a{color:#9ce8ec}#status{min-height:2.5em;margin-top:20px}</style></head><body><main><h1>🔑 Neues Passwort festlegen</h1><p>Wähle ein neues Passwort mit mindestens 12 Zeichen.</p><form id="form"><label for="password">Neues Passwort</label><input id="password" type="password" autocomplete="new-password" minlength="12" required><label for="confirm">Passwort wiederholen</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" required><button id="save" type="submit">Passwort ändern</button></form><p id="status" role="status" aria-live="polite"></p><p><a href="konto.html">← Zum Benutzerkonto</a></p></main><script>const token=new URLSearchParams(location.search).get('token');if(!token){document.getElementById('form').hidden=true;document.getElementById('status').textContent='Der Zurücksetzungslink ist ungültig. Bitte fordere einen neuen Link an.'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('password').value,b=document.getElementById('confirm').value,s=document.getElementById('status'),btn=document.getElementById('save');if(a!==b){s.textContent='Die Passwörter stimmen nicht überein.';return}btn.disabled=true;s.textContent='Passwort wird geändert …';try{const r=await fetch('https://api.e-tongue.com/reset-password.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:a})});const d=await r.json();if(!r.ok)throw Error(d.error||'Fehler');document.getElementById('form').hidden=true;s.textContent='Dein Passwort wurde geändert. Du kannst dich jetzt mit dem neuen Passwort anmelden.';history.replaceState(null,'',location.pathname)}catch(err){s.textContent=err.message||'Der Link ist möglicherweise abgelaufen. Bitte fordere einen neuen Link an.'}finally{btn.disabled=false}});</script></body></html>
